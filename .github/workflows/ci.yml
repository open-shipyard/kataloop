name: CI

on:
  pull_request:
    # ready_for_review starts the security review when a draft becomes ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Each package runs its checks only when it changes. A change to the shared tests
# runs the HTTP tests of every package. A change to this workflow runs
# everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.ci == 'true' }}
      python-http: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.ci == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci:
              - .github/workflows/ci.yml
            shared:
              - tests/**
            python:
              - packages/python/**
            typescript:
              - packages/typescript/**

  # The checks that read the code alike on either major of the MCP SDK, once.
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # uni-llm-client is a git dependency until it is released, so it is built
      # from source here; `--no-build` returns with its first release.
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      # Each package ships copies of the root license files.
      - run: |
          for p in kataloop-core kataloop; do
            for f in LICENSE NOTICE AUTHORS; do cmp "$p/$f" "../../$f"; done
          done

  # mypy and the unit tests, in an environment of each major of the MCP SDK,
  # mypy leaving out the other major's modules (packages/python/CONTRIBUTING.md).
  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: mcp-1
            mypy: "--always-false MCP_2 --exclude '_mcp2\\.py$'"
          - extra: mcp-2
            mypy: "--always-true MCP_2 --exclude '_mcp1\\.py$'"
    env:
      UV_PROJECT_ENVIRONMENT: .venv-${{ matrix.extra }}
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra ${{ matrix.extra }}
      - run: uv run --locked mypy ${{ matrix.mypy }}
      - run: uv run --locked pytest

  python-build:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the package versions from the git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --package kataloop-core
      - run: uv build --package kataloop

  # The language-agnostic tests against the Python test server, on each major of
  # the MCP SDK. Their coverage of both packages, from the two runs, is the only
  # coverage reported for them.
  python-http:
    needs: changes
    if: needs.changes.outputs.python-http == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # The test server's environments, one per major of the MCP SDK, built
      # before the runner starts the server in each (implementations.json).
      - working-directory: packages/python
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-mcp-1 uv sync --locked --extra mcp-1
          UV_PROJECT_ENVIRONMENT=.venv-mcp-2 uv sync --locked --extra mcp-2
      - run: uv run --locked pytest --package python
      # The coverage of both runs, combined.
      - working-directory: packages/python
        env:
          UV_PROJECT_ENVIRONMENT: .venv-mcp-2
        run: |
          uv run --locked coverage combine
          uv run --locked coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: packages/python/coverage.xml

  shared-lint:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # The one check to require: it passes when every job passed or was skipped.
  ci-ok:
    if: always()
    needs:
      - changes
      - python-lint
      - python-test
      - python-build
      - python-http
      - shared-lint
      - typescript
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  security-screening:
    name: Claude security screening
    # The tests first, so that the review spends nothing on broken code.
    needs: ci-ok
    # Ready pull requests from this repository only: forks get no secrets, and Claude trusts the code it reads.
    # Every review job names its own condition: a job skipped upstream, such as a
    # package's that did not change, would otherwise skip all those after it.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' &&
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touches_security: ${{ fromJSON(steps.screen.outputs.structured_output).touches_security }}
    steps:
      # The merge commit, so branches from before the prompt files still have them.
      - uses: actions/checkout@v7
      - id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'text<<END_OF_PROMPT'
            envsubst '$REPO $PR_NUMBER' < .github/prompts/security-screening.md
            echo 'END_OF_PROMPT'
          } >> "$GITHUB_OUTPUT"
      # v1.0.262
      - id: screen
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-haiku-5-5
            --effort low
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"touches_security":{"type":"boolean"}},"required":["touches_security"]}'

  # Posts with the workflow token, as `github-actions[bot]`. The job holds no
  # `id-token`, so nothing in it can sign in as an app.
  security-review:
    name: Claude security review
    needs: security-screening
    if: ${{ !cancelled() && needs.security-screening.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DEPTH: ${{ needs.security-screening.outputs.touches_security == 'true' && 'Deep' || 'Standard' }}
      # The repository variable SECURITY_REVIEW_MODEL picks the model, in Settings → Secrets and variables → Actions.
      MODEL: ${{ vars.SECURITY_REVIEW_MODEL || 'claude-opus-5-5' }}
      EFFORT: ${{ needs.security-screening.outputs.touches_security == 'true' && 'xhigh' || 'medium' }}
    steps:
      # The merge commit, so branches from before the prompt files still have them.
      - uses: actions/checkout@v7
      - id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo 'text<<END_OF_PROMPT'
            envsubst '$REPO $PR_NUMBER $HEAD_SHA $DEPTH $MODEL $EFFORT' < .github/prompts/security-review.md
            echo 'END_OF_PROMPT'
          } >> "$GITHUB_OUTPUT"
      # v1.0.262
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ env.MODEL }}
            --effort ${{ env.EFFORT }}
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment ${{ github.event.pull_request.number }}:*)"
